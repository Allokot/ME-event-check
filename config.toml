# Middle East aviation event monitor (step 1: event check)
# Matching is on headlines. English terms match at word starts ("iran" also hits "Iranian");
# Arabic, Hebrew and Persian terms match anywhere, because prefixes attach to words.
# Spelling variants (أ/ا, ي/ی, ״/") are normalised, so one spelling per term is enough.

[settings]
timezone = "Europe/Amsterdam"
cooldown_minutes = 90      # minimum gap between news alerts for the same region
cluster_threshold = 6      # medium items for one region in one run that escalate to an alert
max_age_hours = 6          # ignore items published longer ago than this
max_date_checks = 25       # per run: Google News items whose real publish date is read from the article page
story_similarity = 0.6     # share of words two headlines must have in common to count as the same story
story_window_days = 7      # how long a story is remembered; re-reports within this window don't alert
seen_retention_days = 7
digest_hour = 7            # local hour of the daily check-in

# Region -> terms that identify it in a headline (home airlines included)
[regions]
Middle_East  = ["middle east", "الشرق الاوسط", "המזרח התיכון", "خاورمیانه"]
Iran         = ["imam khomeini", "mehrabad", "iran air", "mahan air", "iran", "tehran", "isfahan", "shiraz", "mashhad", "bandar abbas", "ایران", "طهران", "تهران", "اصفهان", "איראן", "טהרן"]
Iraq         = ["iraq", "baghdad", "erbil", "basra", "kurdistan region", "عراق", "بغداد", "اربیل", "עיראק", "בגדאד"]
Israel       = ["el al", "israir", "arkia", "israel", "tel aviv", "ben gurion", "jerusalem", "haifa", "eilat", "اسرائیل", "تل ابیب", "ישראל", "תל אביב", "נתב\"ג", "בן גוריון", "אילת", "חיפה"]
Lebanon      = ["rafic hariri", "middle east airlines", "lebanon", "lebanese", "beirut", "hezbollah", "لبنان", "بیروت", "حزب الله", "לבנון", "ביירות", "חיזבאללה"]
Syria        = ["syria", "damascus", "aleppo", "سوریا", "سوریه", "دمشق", "حلب", "סוריה", "דמשק"]
Jordan       = ["queen alia", "royal jordanian", "jordan", "amman", "aqaba", "الاردن", "اردن", "العقبه", "ירדן", "עקבה"]
Saudi_Arabia = ["king khalid", "king abdulaziz", "king fahd", "najran", "jizan", "jazan", "mecca", "makkah", "medina", "نجران", "جازان", "saudia", "flynas", "flyadeal", "riyadh air", "saudi", "riyadh", "jeddah", "dammam", "abha", "السعودیه", "عربستان", "الریاض", "جده", "الدمام", "סעודיה", "ריאד"]
Yemen        = ["yemen", "houthi", "sanaa", "aden", "الیمن", "یمن", "الحوثی", "حوثی", "صنعاء", "תימן", "חות'י"]
UAE          = ["flydubai", "emirates", "etihad", "air arabia", "uae", "emirati", "dubai", "abu dhabi", "sharjah", "الامارات", "امارات", "دبی", "ابوظبی", "ابو ظبی", "الشارقه", "האמירויות", "דובאי", "אבו דאבי"]
Qatar        = ["hamad international", "qatar", "doha", "قطر", "الدوحه", "קטר", "דוחא"]
Bahrain      = ["gulf air", "bahrain", "manama", "البحرین", "بحرین", "المنامه", "בחריין"]
Kuwait       = ["kuwait", "الکویت", "کویت", "כווית"]
Oman         = ["oman", "muscat", "سلطنه عمان", "مسقط", "עומאן"]
Egypt_Sinai  = ["sinai", "sharm el-sheikh", "سیناء", "شرم الشیخ", "סיני"]
Gulf_waters  = ["strait of hormuz", "persian gulf", "gulf of oman", "red sea", "مضیق هرمز", "تنگه هرمز", "البحر الاحمر", "הורמוז", "ים סוף"]

[keywords]
# Aviation disruption: one hit plus a region makes an alert
high = [
  # English. "re:" lines are patterns: an action word within a few words of "airspace" or "airlines"
  're:\b(clos|shut|reopen|restor|avoid|warn|advis|threat|bans?\b|block)\w*\W+(?:\w+\W+){0,5}?airspace',
  're:airspace\W+(?:\w+\W+){0,4}?(clos|shut|reopen|restor|unsafe|danger|target|warning|advisory|risk|threat)',
  're:\bwarns?\W+(?:\w+\W+){0,3}?airlines',
  're:\bextends?\W+(?:\w+\W+){0,3}?(suspension|cancell)',
  # Attacks on airports, either word order, in English, Arabic, Hebrew, Persian
  're:\b(attack|strike|struck|hit|target|shell|bomb|blast|explosion|fire|drone|missile|rocket)\w*\W+(?:\w+\W+){0,6}?airports?\b',
  're:\bairports?\W+(?:\w+\W+){0,4}?(attack|strike|struck|hit|target|shell|bomb|blast|explosion|fire|drone|missile|rocket)',
  're:(قصف|استهداف|هجوم|ضرب|غاره|غارات|انفجار|صاروخ|مسیره)[^.]{0,30}مطار',
  're:مطار[^.]{0,30}(قصف|استهداف|هجوم|ضرب|غاره|انفجار|صاروخ|مسیره)',
  're:(טיל|פגיע|פגע|נפיל|רחפן|כטב"ם|פיצוץ|תקיפ)[^.]{0,30}(נתב"ג|שדה התעופה|נמל התעופה)',
  're:(נתב"ג|שדה התעופה|נמל התעופה)[^.]{0,30}(טיל|פגיע|פגע|נפיל|רחפן|כטב"ם|פיצוץ|תקיפ)',
  're:(حمله|موشک|پهپاد|انفجار)[^.]{0,30}فرودگاه',
  're:فرودگاه[^.]{0,30}(حمله|موشک|پهپاد|انفجار)',
  "advises against flights", "closes airspace", "closed airspace", "closes its airspace", "airspace closure", "airspace closed",
  "shuts airspace", "reopens airspace", "airspace reopen", "unsafe airspace", "airspace unsafe",
  "avoid airspace", "airspace warning", "airspace restriction", "warns airlines", "no-fly",
  "notam", "flights suspended", "suspends flights", "suspended flights", "suspend flights",
  "suspension of flights", "extends suspension", "extend suspension", "flights cancelled",
  "flights canceled", "cancels flights", "cancelled flights", "flight cancellations",
  "route cancellations", "airport closed", "closes airport", "airport closure",
  "flights diverted", "diverted flights", "reroute", "flight ban", "halts flights",
  "grounded", "suspends operations", "resumes flights", "flights resume",
  # Arabic
  "المجال الجوی", "اغلاق الاجواء", "تعلیق الرحلات", "تعلیق رحلات", "الغاء الرحلات", "الغاء رحلات",
  "تعلق رحلاتها", "تعلیق رحلاتها", "تمدد تعلیق", "تمدد الغاء", "تلغی رحلات", "اغلاق مطار", "تحویل مسار", "تحویل الرحلات", "حظر الطیران", "توقف حرکه الطیران", "استئناف الرحلات",
  # Hebrew
  "המרחב האווירי", "מרחב אווירי", "ביטול טיסות", "ביטולי טיסות", "טיסות בוטלו", "בוטלו טיסות",
  "השעיית טיסות", "משעות את הטיסות", "מבטלות טיסות", "נסגר לטיסות",
  # Persian
  "حریم هوایی", "لغو پرواز", "پروازها لغو", "تعلیق پرواز", "توقف پرواز", "تعطیلی فرودگاه",
]
# Security: logged; enough for one region in one run makes a cluster alert
medium = [
  "airspace", "missile", "drone attack", "drone strike", "drones", "airstrike", "air strike",
  "strikes on", "ballistic", "intercept", "air defence", "air defense", "rocket", "explosions",
  "gps jamming", "gps spoofing", "escalat", "retaliat",
  "صاروخ", "صواریخ", "طائره مسیره", "طائرات مسیره", "مسیره", "غاره", "غارات", "الدفاع الجوی", "بالیستی", "انفجارات",
  "טילים", "שיגור", "יירוט", "כטב\"ם", "רחפן", "אזעקות", "צבע אדום", "תקיפה",
  "موشک", "پهپاد", "پدافند", "حمله هوایی", "انفجار",
]
# Headlines containing any of these are ignored
exclude = ["polymarket", "odds", "betting", "prediction market", "stocks", "shares", "crypto",
           "bitcoin", "football", "fifa", "oil price", "military access", "military action",
           "us planes", "u.s. planes", "us aircraft", "u.s. aircraft", "conference", "ebola", "ایبولا",
           "re:\\bus\\W+(?:\\w+\\W+){0,2}?airspace\\W+(use|for)", "re:\\b(use|using)\\W+(?:\\w+\\W+){0,2}?airspace\\W+(to|for)"]

# ---------- sources ----------

# Google News searches. Optional: hl, gl, ceid (edition), region (used when a headline names none).
[[google_news]]
name = "gn-aviation"
query = '(airspace OR NOTAM OR "flights suspended" OR "flights cancelled" OR "airport closed") (Iran OR Iraq OR Israel OR Lebanon OR Syria OR Jordan OR Yemen OR Saudi OR UAE OR Qatar OR Bahrain OR Kuwait OR Oman) when:2h'
[[google_news]]
name = "gn-security"
query = '(missile OR airstrike OR "drone attack" OR "air defense") (Iran OR Iraq OR Israel OR Lebanon OR Syria OR Yemen OR Saudi OR UAE OR Qatar OR Bahrain OR Kuwait OR Oman) when:2h'
[[google_news]]
name = "gn-gulf-local"
query = '(airspace OR flights OR airport OR airline OR missile OR drone) (site:khaleejtimes.com OR site:gulfnews.com OR site:thenationalnews.com OR site:gulf-times.com OR site:thepeninsulaqatar.com OR site:arabnews.com OR site:kuwaittimes.com OR site:timesofoman.com OR site:gdnonline.com) when:2h'
[[google_news]]
name = "gn-levant-local"
query = '(airspace OR flights OR airport OR airline OR missile OR drone) (site:rudaw.net OR site:kurdistan24.net OR site:shafaq.com OR site:lorientlejour.com OR site:naharnet.com OR site:jordantimes.com OR site:iranintl.com OR site:english.aawsat.com OR site:timesofisrael.com) when:2h'
[[google_news]]
name = "gn-arabic-ae"
query = '("المجال الجوي" OR "إلغاء الرحلات" OR "تعليق الرحلات" OR "إغلاق مطار" OR صواريخ OR "الدفاع الجوي") when:2h'
hl = "ar"
gl = "AE"
ceid = "AE:ar"
[[google_news]]
name = "gn-arabic-sa"
query = '("المجال الجوي" OR "إلغاء الرحلات" OR "تعليق الرحلات" OR "إغلاق مطار" OR صواريخ OR "الدفاع الجوي") when:2h'
hl = "ar"
gl = "SA"
ceid = "SA:ar"
[[google_news]]
name = "gn-arabic-lb"
query = '("المجال الجوي" OR "إلغاء الرحلات" OR "تعليق الرحلات" OR "إغلاق مطار" OR صواريخ OR غارة) when:2h'
hl = "ar"
gl = "LB"
ceid = "LB:ar"
[[google_news]]
name = "gn-hebrew"
query = '("המרחב האווירי" OR "ביטול טיסות" OR טיסות OR טילים OR יירוט OR נתב"ג) when:6h'
hl = "he"
gl = "IL"
ceid = "IL:he"
region = "Israel"

